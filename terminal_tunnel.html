<!DOCTYPE html>
<html>
<head>
    <title>VM Terminal (Direct IP Mode)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <style>
        body { background-color: #111; color: white; font-family: sans-serif; padding: 20px; }
        #terminal { width: 800px; height: 400px; margin-top: 20px; border: 1px solid #333; }
        input { padding: 10px; font-size: 16px; margin-right: 10px; margin-bottom: 10px; width: 250px; }
        button { padding: 10px; font-size: 16px; cursor: pointer; }
        .form-group { display: flex; align-items: center; }
    </style>
</head>
<body>
    <h2>WebSocket Terminal (SSH Tunnel)</h2>

    <div class="form-group">
        <input type="text" id="vmName" placeholder="VM Name (e.g. test-ubuntu)">
        <input type="text" id="vmIp" placeholder="VM IP Address (e.g. 192.168.122.50)">
        <button onclick="connect()">Connect</button>
    </div>

    <div id="terminal"></div>

    <script>
        let currentWs = null;

        function connect() {
            const vm = document.getElementById('vmName').value;
            const ip = document.getElementById('vmIp').value;

            if (!vm) return alert("Please enter a VM name!");
            if (!ip) return alert("Please enter the VM IP address!");

            // Close existing connection if there is one
            if (currentWs) {
                currentWs.close();
            }

            const term = new Terminal({ cursorBlink: true });
            document.getElementById('terminal').innerHTML = "";
            term.open(document.getElementById('terminal'));

            // Append both owner and the IP directly to the connection string
            const wsUrl = `ws://localhost:8000/ws/vm/${vm}/terminal?owner=thesis-tester&ip=${ip}`;

            term.writeln(`\x1b[36mConnecting to ${wsUrl}...\x1b[0m`);

            currentWs = new WebSocket(wsUrl);

            currentWs.onopen = () => term.writeln('\x1b[32mWebSocket Connected! Waiting for SSH prompt...\x1b[0m\r\n');
            currentWs.onerror = (e) => term.writeln('\x1b[31m\r\nWebSocket Error. Check server logs.\x1b[0m');
            currentWs.onclose = () => term.writeln('\x1b[33m\r\nConnection Closed\x1b[0m');

            currentWs.onmessage = (event) => term.write(event.data);
            term.onData((data) => {
                if (currentWs.readyState === WebSocket.OPEN) {
                    currentWs.send(data);
                }
            });
        }
    </script>
</body>
</html>
