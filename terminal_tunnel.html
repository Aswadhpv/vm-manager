<!DOCTYPE html>
<html>
<head>
    <title>VM Terminal (Tunnel Mode)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <style>
        body { background-color: #111; color: white; font-family: sans-serif; padding: 20px; }
        #terminal { width: 800px; height: 400px; margin-top: 20px; border: 1px solid #333; }
        input, button { padding: 10px; font-size: 16px; margin-right: 10px; }
    </style>
</head>
<body>
    <h2>WebSocket Terminal (SSH Tunnel)</h2>
    <input type="text" id="vmName" placeholder="VM Name (e.g. thesis-demo)">
    <button onclick="connect()">Connect via WebSocket</button>

    <div id="terminal"></div>

    <script>
        function connect() {
            const vm = document.getElementById('vmName').value;
            if (!vm) return alert("Please enter a VM name!");

            const term = new Terminal({ cursorBlink: true });
            document.getElementById('terminal').innerHTML = ""; 
            term.open(document.getElementById('terminal'));
            
            term.writeln(`\x1b[36mConnecting to ws://localhost:8000/ws/vm/${vm}/terminal...\x1b[0m`);

            // Connects through your local laptop's SSH tunnel directly to the server
            const ws = new WebSocket(`ws://localhost:8000/ws/vm/${vm}/terminal?owner=thesis-tester`);

            ws.onopen = () => term.writeln('\x1b[32mWebSocket Connected! Waiting for SSH prompt...\x1b[0m\r\n');
            ws.onerror = (e) => term.writeln('\x1b[31m\r\nWebSocket Error. Is the VM running?\x1b[0m');
            ws.onclose = () => term.writeln('\x1b[33m\r\nConnection Closed\x1b[0m');

            ws.onmessage = (event) => term.write(event.data);
            term.onData((data) => {
                if (ws.readyState === WebSocket.OPEN) ws.send(data);
            });
        }
    </script>
</body>
</html>
